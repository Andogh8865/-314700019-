<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
/* Werewolf Master — standalone, dependency-free web application.
   Local state is the single source of truth; no server or analytics used. */
(() => {
  'use strict';
  const STORAGE = 'werewolf-master:v1.1';
  const ROLES = {
    wolf: {name:'狼人', group:'wolf', icon:'☾', about:'夜晚與狼隊友商議並選擇一位目標。'},
    wolfking: {name:'狼王', group:'wolf', icon:'♛', about:'狼人陣營。特定死亡方式可帶走一位玩家。'},
    seer: {name:'預言家', group:'god', icon:'✧', about:'每晚查驗一位玩家屬於狼人或好人。'},
    witch: {name:'女巫', group:'god', icon:'⚗', about:'擁有一瓶解藥與一瓶毒藥，每夜最多使用一瓶。'},
    hunter: {name:'獵人', group:'god', icon:'➶', about:'被狼人擊殺或放逐時，可以開槍帶走一人。'},
    guard: {name:'守衛', group:'god', icon:'⬡', about:'每晚守護一名玩家，不可連續守護同一人。'},
    knight: {name:'騎士', group:'god', icon:'♞', about:'白天可以發動一次決鬥，判斷對方是否為狼人。'},
    villager: {name:'村民', group:'village', icon:'❀', about:'沒有夜晚技能，依靠討論與投票找出狼人。'}
  };
  const roleName = r => ROLES[r]?.name || r;
  const isWolf = r => r === 'wolf' || r === 'wolfking';
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initialNames = () => Array.from({length:12}, (_,i) => `玩家 ${String(i+1).padStart(2,'0')}`);
  const cleanState = () => ({view:'home',setup:{count:12,fourth:'guard',names:initialNames()},game:null});
  let state;
  try {state = JSON.parse(localStorage.getItem(STORAGE) || 'null') || cleanState();} catch {state=cleanState();}
  if (!state.setup || !Array.isArray(state.setup.names)) state=cleanState();
  if (state.game && state.view === 'reveal') state.game.revealed=false;
  let selected = null;
  let witchMode = 'none';
  let showRoles = true;
  let toastTimer;
  const $app = document.getElementById('app');
  const $toast = document.getElementById('toast');

  function save() {try {localStorage.setItem(STORAGE,JSON.stringify(state));} catch {/* storage disabled */}}
  function rerender() {save();$app.innerHTML = render();}
  function notify(message) {clearTimeout(toastTimer);$toast.textContent=message;$toast.classList.add('show');toastTimer=setTimeout(()=>$toast.classList.remove('show'),3100);}
  function player(game,id) {return game.players.find(p=>p.id===id);}
  function alive(game) {return game.players.filter(p=>p.alive);}
  function roleOwner(game,role) {return game.players.find(p=>p.role===role);}
  function livingRole(game,role) {const p=roleOwner(game,role);return p && p.alive;}
  function nameOf(game,id) {return player(game,id)?.name || '未知玩家';}
  function makePool(count,fourth) {
    const pool=[];
    const counts = {9:{wolf:3,villager:3},10:{wolf:3,villager:3},11:{wolf:4,villager:3},12:{wolf:3,wolfking:1,villager:4}}[count];
    Object.entries(counts).forEach(([r,n])=>{for(let i=0;i<n;i++)pool.push(r);});
    pool.push('seer','witch','hunter');
    if(count>9)pool.push(fourth);
    return pool;
  }
  function shuffle(arr) {
    const result=[...arr];
    for(let i=result.length-1;i>0;i--){
      let j;
      if(window.crypto?.getRandomValues){const rnd=new Uint32Array(1);crypto.getRandomValues(rnd);j=rnd[0]%(i+1);}
      else j=Math.floor(Math.random()*(i+1));
      [result[i],result[j]]=[result[j],result[i]];
    }
    return result;
  }
  function logEvent(g,title,detail='') {g.log.unshift({round:g.round,title,detail,at:Date.now()});}
  function startGame() {
    const inputs=[...document.querySelectorAll('[data-name-index]')];
    const count=Number(state.setup.count);
    for(const input of inputs)state.setup.names[Number(input.dataset.nameIndex)]=input.value.trim();
    const names=state.setup.names.slice(0,count).map(s=>s.trim());
    if(names.some(s=>!s)){notify('請填寫所有玩家名稱。');return;}
    if(new Set(names).size!==count){notify('玩家名稱不能重複，請修改後再開始。');return;}
    if(names.some(s=>s.length>20)){notify('玩家名稱請勿超過 20 個字。');return;}
    const pool=shuffle(makePool(count,state.setup.fourth));
    if(pool.length!==count){notify('角色數量異常，請重新設定。');return;}
    const players=names.map((name,i)=>({id:`p${i+1}`,name,role:pool[i],alive:true,deathCause:null,diedRound:null}));
    const g={id:`game-${Date.now()}`,count,fourth:count>9?state.setup.fourth:null,players,
      round:1,phase:'night',step:'',revealIndex:0,revealed:false,revealCompleted:false,
      potion:{save:1,poison:1},lastGuardTarget:null,knightUsed:false,hunterUsed:false,wolfKingUsed:false,
      night:{guardTarget:null,wolfTarget:null,seerTarget:null,seerResult:null,witchAction:'none',poisonTarget:null},
      votes:{},revoteCandidates:[],resultDeaths:[],resultTitle:'',
      queue:[],resolution:null,log:[],winner:null};
    g.step=nightSteps(g)[0];
    logEvent(g,'本局建立',`${count} 人局・第四神：${count===9?'無':roleName(state.setup.fourth)}`);
    state.game=g;state.view='reveal';selected=null;witchMode='none';rerender();
  }
  function nightSteps(g) {return [...(livingRole(g,'guard')?['guard']:[]),'wolf',...(livingRole(g,'seer')?['seer']:[]),...(livingRole(g,'witch')?['witch']:[])];}
  function nextNight(g) {g.round++;g.phase='night';g.night={guardTarget:null,wolfTarget:null,seerTarget:null,seerResult:null,witchAction:'none',poisonTarget:null};g.step=nightSteps(g)[0];g.votes={};g.revoteCandidates=[];selected=null;witchMode='none';logEvent(g,`第 ${g.round} 夜開始`);rerender();}
  function advanceNight(g) {const steps=nightSteps(g);const next=steps[steps.indexOf(g.step)+1];selected=null;witchMode='none';if(next)g.step=next;else resolveNight(g);rerender();}
  function addDeath(g,id,cause) {
    const p=player(g,id);
    if(!p || !p.alive) return false;
    p.alive=false;p.deathCause=cause;p.diedRound=g.round;
    g.resolution.deaths.push(id);
    const causes={wolf:'狼人擊殺',poison:'女巫毒殺',vote:'白天放逐',hunter:'獵人開槍',wolfking:'狼王帶人',knight:'騎士決鬥'};
    logEvent(g,`${p.name} 出局`,`${roleName(p.role)}・${causes[cause]||cause}`);
    if(p.role==='hunter'&&!g.hunterUsed&&['wolf','vote'].includes(cause))g.queue.push({id:p.id,role:'hunter'});
    if(p.role==='wolfking'&&!g.wolfKingUsed&&['wolf','vote','hunter'].includes(cause))g.queue.push({id:p.id,role:'wolfking'});
    return true;
  }
  function startResolution(g,deaths,type,title) {
    g.resolution={type,title,deaths:[]};g.queue=[];
    deaths.forEach(d=>addDeath(g,d.id,d.cause));
    if(g.queue.length)g.phase='chain';else completeResolution(g);
  }
  function checkWinner(g) {
    const living=alive(g);
    const wolves=living.filter(p=>isWolf(p.role)).length;
    const gods=living.filter(p=>ROLES[p.role].group==='god').length;
    const villagers=living.filter(p=>p.role==='villager').length;
    if(wolves===0)return 'good';
    if(gods===0||villagers===0)return 'wolf';
    return null;
  }
  function completeResolution(g) {
    const r=g.resolution;g.resolution=null;g.queue=[];
    if(!r)return;
    g.resultDeaths=[...r.deaths];g.resultTitle=r.title;
    const winner=checkWinner(g);
    if(winner){g.winner=winner;g.phase='over';logEvent(g,'遊戲結束',winner==='good'?'好人陣營勝利':'狼人陣營勝利');return;}
    if(r.type==='night')g.phase='dawn';
    else if(r.type==='knight-good')g.phase='day';
    else g.phase='dayResult';
  }
  function resolveNight(g) {
    const n=g.night;const deaths=[];
    if(n.wolfTarget){
      const guarded=n.guardTarget===n.wolfTarget;
      const saved=n.witchAction==='save';
      if(guarded===saved) deaths.push({id:n.wolfTarget,cause:'wolf'}); // neither or both (同守同救)
    }
    if(n.witchAction==='poison'&&n.poisonTarget){
      const prior=deaths.find(d=>d.id===n.poisonTarget);
      if(prior)prior.cause='poison';else deaths.push({id:n.poisonTarget,cause:'poison'});
    }
    logEvent(g,`第 ${g.round} 夜行動結算`,deaths.length?`本晚 ${deaths.length} 人死亡`:'平安夜');
    startResolution(g,deaths,'night',`第 ${g.round} 夜結算`);
  }

      <div class="vote-list">${living.map(p=>`<div class="vote-line"><label for="vote-${p.id}">${escapeHtml(p.name)}</label><select id="vote-${p.id}" data-voter="${p.id}">
      <option value="">選擇投票…</option><option value="abstain" ${g.votes[p.id]==='abstain'?'selected':''}>棄票</option>
      ${targets.filter(id=>id!==p.id).map(id=>`<option value="${id}" ${g.votes[p.id]===id?'selected':''}>${escapeHtml(nameOf(g,id))}</option>`).join('')}</select></div>`).join('')}</div>
      <div class="action-buttons"><button class="btn btn-primary" data-action="submit-votes">${revote?'完成重投並結算':'統計投票結果'} →</button></div></section></div>`;
  }
  function renderDayResult(g) {
    const ids=g.resultDeaths;
    return `<div class="action-area"><section class="panel"><div class="eyebrow">DAY RESULTS / 本日結算</div><h3>✦ ${escapeHtml(g.resultTitle||'本日結束')}</h3>
      ${ids.length?`<p class="action-sub">本次流程出局玩家：</p><div class="summary-list">${ids.map(id=>`<span class="summary-player">${escapeHtml(nameOf(g,id))}</span>`).join('')}</div>`:'<div class="result-bubble">今日沒有人出局</div>'}
      <div class="action-buttons"><button class="btn btn-primary" data-action="next-night">進入下一個夜晚 →</button></div></section></div>`;
  }
  function renderStage(g) {
    if(g.phase==='night')return renderNight(g);
    if(g.phase==='chain')return renderChain(g);
    if(g.phase==='dawn')return renderDawn(g);
    if(g.phase==='day')return renderDay(g);
    if(['vote','revote'].includes(g.phase))return votesUI(g);
    if(g.phase==='dayResult')return renderDayResult(g);
    return '';
  }
  function renderSidebar(g) {
    const living=alive(g);
    const wolf=living.filter(p=>isWolf(p.role)).length;
    const gods=living.filter(p=>ROLES[p.role].group==='god').length;
    const vill=living.filter(p=>p.role==='villager').length;
    return `<aside class="sidebar"><section class="panel"><h3>本局資訊</h3><div class="kv"><span>目前回合</span><strong>第 ${g.round} 回合</strong></div>
      <div class="kv"><span>狼人存活</span><span class="badge wolf">${wolf}</span></div><div class="kv"><span>神職存活</span><span class="badge god">${gods}</span></div>
      <div class="kv"><span>村民存活</span><span class="badge village">${vill}</span></div>
      <div class="divider"></div><h3>道具與技能</h3><div class="kv"><span>女巫解藥</span><strong>${g.potion.save} 瓶</strong></div>
      <div class="kv"><span>女巫毒藥</span><strong>${g.potion.poison} 瓶</strong></div>
      ${g.fourth==='knight'?`<div class="kv"><span>騎士決鬥</span><strong>${g.knightUsed?'已使用':'未使用'}</strong></div>`:''}
      ${g.count===12?`<div class="kv"><span>狼王帶人</span><strong>${g.wolfKingUsed?'已使用':'未使用'}</strong></div>`:''}
      <div class="divider"></div><div class="banner">所有角色與技能紀錄僅供上帝查看；公布遊戲結果時請避免展示本頁。</div></section>
      <section class="panel"><div class="section-head"><h3>遊戲紀錄</h3><span class="badge">${g.log.length}</span></div>
      <div class="log-list">${g.log.slice(0,18).map(item=>`<div class="log-entry"><div class="log-title">${escapeHtml(item.title)}</div><div class="log-detail">${escapeHtml(item.detail)}</div></div>`).join('')}</div></section>
      <button class="btn btn-ghost btn-block" style="margin-top:15px" data-action="reset">↺ 重新開局</button></aside>`;
  }
  function renderGame() {
    const g=state.game;
    if(g.phase==='over')return renderEnd();
    return `<div class="container"><div class="game-layout"><main>${gameTop(g)}${playerBoard(g)}${renderStage(g)}
      <p class="footnote">✦ 進度會自動儲存在本機瀏覽器，重新整理也可繼續遊戲。</p></main>${renderSidebar(g)}</div></div>`;
  }
  function renderEnd() {
    const g=state.game;
    const win=g.winner==='good';
    return `<div class="container"><section class="winner-hero"><div class="eyebrow">THE STORY ENDS HERE</div><div class="winner-emblem">${win?'✦':'☾'}</div><h1>${win?'好人陣營勝利！':'狼人陣營勝利！'}</h1>
      <p>${win?'所有狼人已經出局，黎明終於屬於村莊。':'狼人成功完成屠邊，村莊陷入永恆黑夜。'}</p>
      <div class="flex wrap" style="justify-content:center;margin:25px 0"><span class="badge">${g.count} 人局</span><span class="badge">進行 ${g.round} 回合</span><span class="badge">第四神：${g.fourth?roleName(g.fourth):'無'}</span></div></section>
      <section class="panel"><div class="section-head"><h3>所有玩家身分揭曉</h3><span class="badge">最終結算</span></div>
        <div class="player-grid">${g.players.map(p=>`<div class="player-card ${p.alive?'':'dead'}"><span class="avatar">${escapeHtml(p.name.slice(0,1))}</span><span class="player-name">${escapeHtml(p.name)}</span>
        <span class="badge ${ROLES[p.role].group}">${roleName(p.role)}</span></div>`).join('')}</div></section>
      <div class="action-buttons" style="justify-content:center;margin-top:26px"><button class="btn btn-primary" data-action="new">再玩一場 →</button><button class="btn btn-ghost" data-action="go-home">返回首頁</button></div></div>`;
  }
  function render() {return header()+(state.view==='home'?renderHome():state.view==='setup'?renderSetup():state.view==='reveal'&&state.game?renderReveal():state.game?renderGame():renderHome());}
  function doAction(action,element) {
    const g=state.game;
    switch(action) {
      case 'go-home':state.view='home';selected=null;rerender();return;
      case 'new':if(g&&g.phase!=='over'&&!confirm('開始新遊戲將會覆蓋目前進度，確定嗎？'))return;state.view='setup';state.game=null;selected=null;rerender();return;
      case 'resume':if(g){state.view=!g.revealCompleted?'reveal':'game';rerender();}return;
      case 'set-count':{
        document.querySelectorAll('[data-name-index]').forEach(el=>state.setup.names[Number(el.dataset.nameIndex)]=el.value);
        state.setup.count=Number(element.dataset.count);rerender();return;
      }
      case 'assign':startGame();return;
      case 'reveal':g.revealed=true;rerender();return;
      case 'hide-next':g.revealed=false;if(g.revealIndex<g.count-1){g.revealIndex++;}else{g.revealCompleted=true;state.view='game';}rerender();return;
      case 'toggle-roles':showRoles=!showRoles;rerender();return;
      case 'reset':if(confirm('確定重新開局？目前整場遊戲紀錄會被清除。')){state.game=null;state.view='setup';selected=null;rerender();}return;
      case 'pick':selected=element.dataset.id;rerender();return;
      case 'night-guard':if(!selected)return;g.night.guardTarget=selected;g.lastGuardTarget=selected;logEvent(g,'守衛完成守護',nameOf(g,selected));advanceNight(g);return;
      case 'night-guard-skip':g.night.guardTarget=null;g.lastGuardTarget=null;logEvent(g,'守衛選擇空守');advanceNight(g);return;
      case 'night-wolf':if(!selected)return;g.night.wolfTarget=selected;logEvent(g,'狼人選擇目標',nameOf(g,selected));advanceNight(g);return;
      case 'night-wolf-skip':g.night.wolfTarget=null;logEvent(g,'狼人不擊殺');advanceNight(g);return;
      case 'night-seer':if(!selected)return;g.night.seerTarget=selected;g.night.seerResult=isWolf(player(g,selected).role)?'wolf':'good';logEvent(g,'預言家完成查驗',`${nameOf(g,selected)}：${g.night.seerResult==='wolf'?'狼人':'好人'}`);selected=null;rerender();return;
      case 'night-seer-next':advanceNight(g);return;
      case 'witch-mode':witchMode=element.dataset.mode;selected=null;rerender();return;
      case 'night-witch':{
        const witch=roleOwner(g,'witch');
        if(witchMode==='save'){
          if(!g.potion.save||!g.night.wolfTarget||(g.round>1&&g.night.wolfTarget===witch.id)){notify('目前無法使用解藥。');return;}
          g.potion.save--;g.night.witchAction='save';logEvent(g,'女巫使用解藥',nameOf(g,g.night.wolfTarget));
        } else if(witchMode==='poison'){
          if(!g.potion.poison||!selected||selected===witch.id||!player(g,selected).alive){notify('請選擇有效的毒殺對象。');return;}
          g.potion.poison--;g.night.witchAction='poison';g.night.poisonTarget=selected;logEvent(g,'女巫使用毒藥',nameOf(g,selected));
        } else {g.night.witchAction='none';logEvent(g,'女巫未使用藥水');}
        selected=null;witchMode='none';advanceNight(g);return;
      }
      case 'chain-pass':{
        const item=g.queue.shift();if(!item)return;
        if(item.role==='hunter')g.hunterUsed=true;else g.wolfKingUsed=true;
        logEvent(g,`${nameOf(g,item.id)} 放棄技能`);
        if(!g.queue.length)completeResolution(g);selected=null;rerender();return;
      }
      case 'chain-shoot':{
        if(!selected||!player(g,selected)?.alive)return;
        const item=g.queue.shift();if(!item)return;
        if(item.role==='hunter')g.hunterUsed=true;else g.wolfKingUsed=true;
        addDeath(g,selected,item.role==='hunter'?'hunter':'wolfking');
        if(!g.queue.length)completeResolution(g);selected=null;rerender();return;
      }
      case 'begin-day':g.phase='day';selected=null;rerender();return;
      case 'knight-duel':{
        const knight=livingRole(g,'knight');if(!knight||g.knightUsed||!selected||selected===knight.id||!player(g,selected)?.alive)return;
        if(!confirm(`騎士決鬥目標：${nameOf(g,selected)}，確定執行嗎？`))return;
        g.knightUsed=true;
        const hit=isWolf(player(g,selected).role);
        logEvent(g,'騎士發動決鬥',`${knight.name} 決鬥 ${nameOf(g,selected)}：${hit?'命中狼人':'未命中'}`);
        startResolution(g,hit?[{id:selected,cause:'knight'}]:[{id:knight.id,cause:'knight'}],hit?'knight-wolf':'knight-good',hit?'騎士決鬥成功，直接進入下一夜':'騎士決鬥失敗，繼續白天討論');
        selected=null;rerender();return;
      }
      case 'begin-vote':g.phase='vote';g.votes={};selected=null;rerender();return;
      case 'submit-votes':{
        const voters=alive(g);const voteInputs=[...document.querySelectorAll('[data-voter]')];
        const votes={};for(const input of voteInputs){if(!input.value){notify('請為每位存活玩家選擇投票對象，或選擇棄票。');return;}votes[input.dataset.voter]=input.value;}
        g.votes=votes;
        const tally={};Object.values(votes).forEach(v=>{if(v!=='abstain')tally[v]=(tally[v]||0)+1;});
        const max=Math.max(0,...Object.values(tally));const leaders=max?Object.keys(tally).filter(id=>tally[id]===max):[];
        logEvent(g,g.phase==='revote'?'平票重投結果':'白天投票結果',leaders.length?leaders.map(id=>`${nameOf(g,id)}：${tally[id]} 票`).join('、'):'全部棄票');
        if(!leaders.length){startResolution(g,[],'vote','全員棄票，今日無人出局');}
        else if(leaders.length>1){
          if(g.phase==='revote'){startResolution(g,[],'vote','再次平票，今日無人出局');}
          else {g.phase='revote';g.revoteCandidates=leaders;g.votes={};notify('最高票平手，請進行一次重新投票。');}
        } else {startResolution(g,[{id:leaders[0],cause:'vote'}],'vote',`${nameOf(g,leaders[0])} 被投票放逐`);}
        selected=null;rerender();return;
      }
      case 'next-night':nextNight(g);return;
      default:return;
    }
  }
  $app.addEventListener('click',ev=>{const button=ev.target.closest('[data-action]');if(!button||button.disabled)return;try{doAction(button.dataset.action,button);}catch(error){console.error(error);notify('操作發生錯誤，請重新整理後再試。');}});
  $app.addEventListener('change',ev=>{
    const el=ev.target;
    if(el.name==='fourth'){state.setup.fourth=el.value;rerender();}
    if(el.matches('[data-voter]')){state.game.votes[el.dataset.voter]=el.value;save();}
  });
  $app.addEventListener('input',ev=>{
    const el=ev.target;
    if(el.matches('[data-name-index]')){state.setup.names[Number(el.dataset.nameIndex)]=el.value;save();}
  });
  rerender();
})();

</script>
</body>
</html>
